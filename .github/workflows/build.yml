name: Release
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Tron Explorer v__VERSION__"
          releaseBody: "Automated release build for Tron Explorer."
          releaseDraft: false
          prerelease: false

      - name: Upload artifacts to Action summary
        uses: actions/upload-artifact@v4
        with:
          name: tronExplorer-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/tron-explorer*
            src-tauri/target/release/tronExplorer*
          if-no-files-found: warn
